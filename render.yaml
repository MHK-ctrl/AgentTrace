# Render.com blueprint for the AgentTrace API and dashboard.
#
# The database is provisioned by Render. Only the dashboard token is a secret.
#   AGENTTRACE_DASHBOARD_TOKEN   (32-byte hex, must match the dashboard env)
#
# The dashboard also runs here (normal `next start`) because Netlify's Next.js
# runtime injects markup that breaks client hydration; the Netlify site is kept
# only as a redirect to this service.

databases:
  - name: agenttrace-db
    plan: free
    databaseName: agenttrace
    user: agenttrace

services:
  - type: web
    name: agenttrace-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build -w @agenttrace/api
    startCommand: npm run db:migrate && npm run start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AGENTTRACE_DASHBOARD_URL
        value: https://agenttrace-dashboard.onrender.com
      - key: AGENTTRACE_CORS_ORIGINS
        value: https://agenttrace-dashboard.onrender.com
      - key: AGENTTRACE_PUBLIC_DEMO
        value: "true"
      - key: AGENTTRACE_DEMO_TTL_HOURS
        value: "24"
      - key: AGENTTRACE_DEMO_MAX_RUNS
        value: "8"
      - key: AGENTTRACE_DEMO_COOLDOWN_SECONDS
        value: "3"
      - key: AGENTTRACE_DEMO_MAX_CONCURRENT
        value: "3"
      - key: DATABASE_URL
        fromDatabase:
          name: agenttrace-db
          property: connectionString
      - key: AGENTTRACE_DASHBOARD_TOKEN
        sync: false

  - type: web
    name: agenttrace-dashboard
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build -w @agenttrace/dashboard
    startCommand: npm run start:dashboard
    envVars:
      - key: NODE_ENV
        value: production
      - key: AGENTTRACE_API_URL
        value: https://agenttrace-api-glry.onrender.com
      - key: AGENTTRACE_WS_URL
        value: wss://agenttrace-api-glry.onrender.com
      - key: AGENTTRACE_DASHBOARD_URL
        value: https://agenttrace-dashboard.onrender.com
      - key: AGENTTRACE_DASHBOARD_TOKEN
        sync: false
      - key: AGENTTRACE_SESSION_SECRET
        generateValue: true
