# Netlify configuration for AgentTrace dashboard

[build]
  # Build from root; the root package.json build script builds all workspaces
  command = "npm run build"
  # The build script creates .next/ at root containing both app and package outputs
  publish = "apps/dashboard/.next"

# Netlify's Next.js runtime breaks React hydration on this app. The dashboard
# now runs on Render, so keep the original public URL as a permanent redirect.
[[redirects]]
  from = "/*"
  to = "https://agenttrace-dashboard.onrender.com/:splat"
  status = 301
  force = true

[context.production]
  # Environment variables for production deploy
  [env]
    AGENTTRACE_API_URL = "https://agenttrace-api-glry.onrender.com"
    AGENTTRACE_API_PORT = "4000"
    AGENTTRACE_CORS_ORIGINS = "https://cerulean-travesseiro-4c6d32.netlify.app"
    # AGENTTRACE_DASHBOARD_TOKEN is a secret: set it in the Netlify UI
    # (Site configuration > Environment variables), never in this file.
    NEXT_PUBLIC_SITE_URL = "https://cerulean-travesseiro-4c6d32.netlify.app"
    AGENTTRACE_DEMO_TTL_HOURS = "24"
    AGENTTRACE_DEMO_MAX_RUNS = "8"
    AGENTTRACE_DEMO_COOLDOWN_SECONDS = "3"
    AGENTTRACE_DEMO_MAX_CONCURRENT = "3"

[context.develop.environment]
  AGENTTRACE_API_URL = "http://127.0.0.1:4000"
  NEXT_PUBLIC_SITE_URL = "http://localhost:3000"